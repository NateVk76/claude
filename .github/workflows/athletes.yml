# Ajoute des athlètes réels depuis Wikidata (célébrité calée sur la base manuelle d'après les vues
# Wikipédia en français), puis enregistre src/data/athletes.generated.json dans le dépôt.
name: Athlètes générés

on:
  workflow_dispatch:
    inputs:
      echelle:
        description: 'Taille : 1 ≈ 500 athlètes, 20 ≈ 10 000'
        type: string
        default: '1'
  push:
    branches: [claude/laughing-newton-g9nvtx]
    paths:
      - 'sportmasters/scripts/wikidata/**'
      - '.github/workflows/athletes.yml'

permissions:
  contents: write

concurrency:
  group: athletes-generes
  cancel-in-progress: true

jobs:
  athletes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sportmasters
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer les athlètes
        run: node scripts/wikidata/generer-athletes.mjs --contact "https://github.com/${GITHUB_REPOSITORY}" --echelle "${ECHELLE:-1}"
        env:
          ECHELLE: ${{ inputs.echelle }}
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/athletes.generated.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Ajoute des athlètes depuis Wikidata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
